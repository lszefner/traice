name: CI
on:
  push:
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: make install
      - run: make lint
      - run: make test
      - name: Validate Compose
        run: docker compose config --quiet
        env:
          NEO4J_PASSWORD: ci-test-password
